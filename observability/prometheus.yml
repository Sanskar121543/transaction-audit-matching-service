# Scrapes every app instance on the compose network. DNS discovery, not a fixed target list, so the lite
# profile (app1 only) and the full one (app1 + app2) both work with this file, and a restarted container's new
# address is picked up. Each app tags its metrics with app_instance itself.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: matching
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [app1, app2]
        type: A
        port: 8080
        refresh_interval: 10s
