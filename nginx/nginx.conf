worker_processes 2;

events {
    worker_connections 1024;
}

http {
    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
        '"method":"$request_method","uri":"$request_uri","status":$status,"request_length":$request_length,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time","request_time":$request_time}';
    access_log /dev/stdout json;

    # Docker's embedded DNS. With `resolve`, app names are looked up at run time, so the same file
    # works when only app1 exists (lite profile) and picks up a restarted container's new IP.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream matching {
        zone matching 64k;
        # Passive health checks only (active checks need NGINX Plus): one failed connection takes a
        # server out of rotation for 30 seconds. Not less: about 6 s after an instance dies, Docker's DNS
        # stops answering for its name and nginx drops it, leaving one server. If the dead server's timeout
        # ran out before that, nginx sends a request to its old address right as the upstream becomes a
        # single server, and answers 504 without trying the live one (scripts/nginx-dead-upstream.sh:
        # one 504 in 6 of 8 runs at 5 s, none in 8 runs at 30 s).
        server app1:8080 resolve max_fails=1 fail_timeout=30s;
        server app2:8080 resolve max_fails=1 fail_timeout=30s;
        keepalive 16;
        # Shorter than Tomcat's 60s keep-alive, so nginx never reuses a connection Tomcat is closing.
        keepalive_timeout 30s;
    }

    server {
        listen 80;

        # A little above the app's own 32 MB limit, so an oversized upload gets the app's 413 problem
        # response rather than nginx's HTML page.
        client_max_body_size 33m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 1s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        # Path parameters (";x") make nginx and Spring see different paths; nothing here needs them.
        if ($request_uri ~ ";") {
            return 400;
        }

        location = /actuator/health {
            proxy_pass http://matching;
        }

        # Metrics are scraped by Prometheus on the internal network, never through the public port.
        # No trailing slash, so "/actuator" itself and every variant of it are blocked too.
        location ^~ /actuator {
            return 404;
        }

        # Uploading the same file twice is a no-op (same SHA-256 -> the original report), so when an
        # instance dies mid-upload nginx may resend the body, which it has buffered, to the other one.
        # nginx refuses to retry a POST unless told to with non_idempotent. Large files take a while to
        # validate and store, so these get long timeouts, and a retry is allowed however late it comes.
        location ~ ^/v1/runs/[0-9]+/(ledger|statement)$ {
            proxy_pass http://matching;
            proxy_read_timeout 300s;
            proxy_next_upstream error timeout non_idempotent;
            proxy_next_upstream_timeout 0;
        }

        # Every other POST (creating a run, for one) is not idempotent, so it is never resent.
        location /v1/ {
            proxy_pass http://matching;
        }

        location / {
            proxy_pass http://matching;
        }
    }
}
