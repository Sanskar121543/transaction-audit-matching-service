name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers starts Postgres (and later Kafka, app containers and nginx) on the runner's Docker.
      - name: Build and run all tests
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git --log-opts="--all" --redact -v --config /repo/.gitleaks.toml /repo

  commit-messages:
    name: Commit messages carry no AI attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The same rule as .githooks/commit-msg, for commits made where the hook was not installed.
      - name: Check every commit message
        run: |
          if git log --all --format='%H %B' | grep -inE 'co-authored-by|generated with'; then
            echo "A commit message contains 'Co-Authored-By' or 'Generated with'." >&2
            exit 1
          fi
